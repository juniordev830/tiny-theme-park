name: Park economy core tests
on: [push, pull_request]
jobs:
  economy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project Tests/ParkEconomy.Tests.csproj --configuration Release
